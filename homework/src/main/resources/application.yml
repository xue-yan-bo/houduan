# Spring Boot 基础配置
spring:
  application:
    name: homework
  # Spring Cloud 2023版本新要求：显式配置import
  config:
    import: optional:nacos:homework.yml
  cloud:
    nacos:
      # Nacos服务器地址 - 支持环境变量配置
      serverAddr: ${NACOS_SERVER_ADDR:192.168.1.38:8848}
      discovery:
        enabled: true
      config:
        enabled: true
        file-extension: yml

# 服务器配置
server:
  port: ${SERVER_PORT:18080}

# 日志配置
logging:
  level:
    com.jlm.homework: INFO
