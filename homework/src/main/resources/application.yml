# ===================================================================
# Spring Boot 应用配置 - Homework 服务
# Spring Cloud Alibaba 2023 最佳实践配置
# ===================================================================

spring:
  application:
    name: homework
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Spring Cloud 2023版本配置导入
  config:
    import:
      - optional:classpath:database.yml
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml

  # Nacos 配置
  cloud:
    nacos:
      # 服务器地址 - 支持环境变量配置， 启动了？

      server-addr: 192.168.1.38:8848
      # 服务发现配置
      discovery:
        enabled: true
        # 服务注册配置
        register-enabled: true
        # 命名空间 - 设置为dev以发现同命名空间的服务
        namespace: ${NACOS_NAMESPACE:dev}
        # 服务分组
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 心跳间隔（毫秒）
        heart-beat-interval: 5000
        # 心跳超时时间（毫秒）
        heart-beat-timeout: 15000
        # IP删除超时时间（毫秒）
        ip-delete-timeout: 30000
        # 元数据
        metadata:
          version: ${project.version:25.0}
          zone: ${DEPLOYMENT_ZONE:default}
      # 配置中心
      config:
        enabled: true
        file-extension: yml
        # 配置中心命名空间
        namespace: ${NACOS_NAMESPACE:dev}
        # 共享配置
        shared-configs:
          - data-id: common-config.yml
            group: ${NACOS_GROUP:DEFAULT_GROUP}
            refresh: true

    # 负载均衡配置
    loadbalancer:
      # 禁用Ribbon，使用新的LoadBalancer
      ribbon:
        enabled: false
      # 启用缓存
      cache:
        enabled: true
        ttl: 35s
        capacity: 256
      # 确保健康检查和服务发现正常工作
      retry:
        enabled: true

# 服务器配置
server:
  port: ${SERVER_PORT:18080}
  # 优雅关闭
  shutdown: graceful
  # Tomcat配置
  tomcat:
    # 连接超时时间
    connection-timeout: 20000
    # 最大连接数
    max-connections: 8192
    threads:
      # 最大线程数
      max: 200
      # 最小线程数
      min-spare: 10

# OpenFeign 配置
feign:
  # 启用熔断器
  circuitbreaker:
    enabled: true
  # 客户端配置
  client:
    config:
      default:
        # 连接超时时间（毫秒）
        connect-timeout: 5000
        # 读取超时时间（毫秒）
        read-timeout: 30000
        # 日志级别
        logger-level: basic

  # 压缩配置
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 2048
    response:
      enabled: true

# Resilience4j 熔断器配置
resilience4j:
  circuitbreaker:
    instances: {}
  # 重试配置
  retry:
    instances: {}
  # 限流配置
  ratelimiter:
    instances: {}

# 注意：已移除 Nacos 远程调用配置，现在使用 OpenFeign 进行服务间通信

# OpenAPI 3.0 配置
springdoc:
  # API文档路径配置
  api-docs:
    path: /v3/api-docs
    enabled: true
  # Swagger UI配置
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # 默认展开所有操作
    doc-expansion: list
    # 显示请求持续时间
    display-request-duration: true
    # 显示操作ID
    display-operation-id: true
    # 默认模型展开深度
    default-models-expand-depth: 2
    # 默认模型渲染
    default-model-rendering: model
    # 启用深度链接
    deep-linking: true
    # 启用过滤
    filter: true
    # 显示扩展
    show-extensions: true
    # 显示通用扩展
    show-common-extensions: true
    # 尝试它按钮配置
    try-it-out-enabled: true

  # 路径匹配配置
  paths-to-match: /api/**
  # 包扫描配置
  packages-to-scan: com.jlm.homework.controller

# 日志配置
logging:
  level:
    root: INFO
    com.jlm.homework: INFO
    com.jlm.remote: DEBUG
    org.springframework.cloud: INFO
    com.alibaba.nacos: INFO
    org.springframework.cloud.loadbalancer: DEBUG
    # OpenFeign 日志
    com.jlm.homework.feign: DEBUG
    # OpenAPI日志
    org.springdoc: INFO
    # SQL日志（开发环境可开启）
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
