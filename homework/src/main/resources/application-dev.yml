# 开发环境配置
server:
  port: ${SERVER_PORT:18080}

# Socket服务配置
socket:
  server:
    port: 6000
    maxConnections: 50
    corePoolSize: 50
    maxPoolSize: 500
    queueCapacity: 2000
# 开发环境数据库配置覆盖
spring:
  datasource:
    # 开发环境使用专门的数据库
    url: ${DEV_DATABASE_URL:jdbc:mysql://192.168.1.251:3306/jlm-homework-design?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DEV_DATABASE_USERNAME:root}
    password: ${DEV_DATABASE_PASSWORD:jlm@1234}
    hikari:
      # 开发环境使用较小的连接池
      maximum-pool-size: 10
      minimum-idle: 2
  rabbitmq:
    host: 192.168.1.38
    port: 5672
    username: root
    password: jlm@1234

  jpa:
    # 开发环境显示SQL
    show-sql: true
    hibernate:
      # 开发环境自动更新表结构
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  #AI
  # 智谱
  ai:
    zhipuai:
      api-key: ${ZHIPU_API_KEY}
      #      base-url: "https://open.bigmodel.cn"
      image:
        options:
          model: ${ZHIPU_IMAGE_MODEL}
      chat:
        options:
          model: ${ZHIPU_CHAT_MODEL}

    # openAI配置
    openai:
      api-key: ${}
      base-url: ${}
      chat:
        options:
          model: ${}
    # 千问配置
  # Redis配置
  data:
    redis:
      host: 192.168.1.38
      port: 6379
      database: 0

