# ===================================================================
# 数据库配置 - Spring Data JPA + MySQL
# ===================================================================

spring:
  # 数据源配置
  datasource:
    # MySQL 8.0+ 驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL - 从环境变量读取
    url: ${DATABASE_URL}
    # 数据库用户名 - 从环境变量读取
    username: ${DATABASE_USERNAME}
    # 数据库密码 - 从环境变量读取
    password: ${DATABASE_PASSWORD}

    # HikariCP 连接池配置（Spring Boot 2.x+ 默认）
    hikari:
      # 连接池名称
      pool-name: HomeworkHikariCP
      # 最小空闲连接数 - 从环境变量读取
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      # 最大连接池大小 - 从环境变量读取
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
      # 连接超时时间（毫秒） - 从环境变量读取
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      # 空闲连接超时时间（毫秒） - 从环境变量读取
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      # 连接最大生命周期（毫秒） - 从环境变量读取
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      # 连接测试查询
      connection-test-query: SELECT 1
      # 自动提交
      auto-commit: true

  # JPA 配置
  jpa:
    # 数据库平台
    database-platform: org.hibernate.dialect.MySQL8Dialect
    # 数据库类型
    database: mysql
    # 显示SQL语句 - 从环境变量读取
    show-sql: ${JPA_SHOW_SQL:true}
    # 格式化SQL输出
    properties:
      hibernate:
        # SQL格式化
        format_sql: true
        # 使用SQL注释
        use_sql_comments: true
        # 批处理大小
        jdbc:
          batch_size: 20
        # 二级缓存配置
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # 连接释放模式
        connection:
          release_mode: after_transaction
    # Hibernate DDL 模式
    hibernate:
      # DDL模式 - 从环境变量读取
      ddl-auto: ${JPA_DDL_AUTO:update}
      # 命名策略
      naming:
        # 物理命名策略（表名、字段名）
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        # 隐式命名策略
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 日志配置 - 数据库相关
logging:
  level:
    # Hibernate SQL 日志 - 从环境变量读取
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:DEBUG}
    # Hibernate 参数绑定日志 - 从环境变量读取
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_PARAM:TRACE}
    # Spring Data JPA 日志 - 从环境变量读取
    org.springframework.data.jpa: ${LOG_LEVEL_SPRING_DATA_JPA:DEBUG}
    # HikariCP 连接池日志
    com.zaxxer.hikari: INFO
    # MySQL 驱动日志
    com.mysql.cj: WARN