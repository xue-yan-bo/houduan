spring:
  application:
    name: ai-server
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.38:8848
        namespace: dev
      config:
        server-addr: 192.168.1.38:8848
        file-extension: yaml
        namespace: dev
  ai:
    openai:
      api-key: "sk-dummy-key-just-to-bypass-startup-check"
    zhipuai:
      api-key: "fb1fc9c0ff2343449849169312c32239.VSKApXu5lGla881O"
    zhipu:
      api-key: "fb1fc9c0ff2343449849169312c32239.VSKApXu5lGla881O"

server:
  port: 9005 # 单独扩容时的默认端口，可以在启动时传参覆盖
  tomcat:
    threads:
      max: 500 # AI服务主要负责计算，可适当调大线程池

# AI 相关配置可统一在这里配，不影响业务代码
ai:
  provider: zhipu
  zhipu:
    api-key: "fb1fc9c0ff2343449849169312c32239.VSKApXu5lGla881O" # 可通过 Nacos 获取
  qianwen:
    api-key: your-qianwen-key-here

zhipu:
  ai:
    api-key: "fb1fc9c0ff2343449849169312c32239.VSKApXu5lGla881O"