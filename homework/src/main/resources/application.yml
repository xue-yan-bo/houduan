server:
  port: 18080

# 日志配置
logging:
  level:
    # 应用日志级别
    com.jlm.homework: DEBUG

---
# 开发环境特定配置
spring:
  config:
    activate:
      on-profile: dev

---
# 生产环境特定配置
spring:
  config:
    activate:
      on-profile: prod

# 生产环境服务器配置
server:
  # 生产环境端口
  port: 8080

# 生产环境日志配置
logging:
  level:
    root: WARN
    com.jlm.homework: INFO
